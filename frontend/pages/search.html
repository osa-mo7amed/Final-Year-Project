<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Jobs — InternMatch</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-container">
  <!-- Sidebar Navigation -->
  <aside class="app-sidebar">
    <div class="brand-logo">
      <span class="badge-logo">IM</span>
      <span>InternMatch</span>
    </div>
    <ul class="nav-menu">
      <li><a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a></li>
      <li><a href="profile.html" class="nav-link"><span>👤</span> My Profile</a></li>
      <li><a href="skill-analysis.html" class="nav-link"><span>📈</span> Skill Analysis</a></li>
      <li><a href="search.html" class="nav-link active"><span>🔍</span> Search Jobs</a></li>
    </ul>
    <div class="sidebar-user">
      <div class="user-name" id="sidebar-user-name">Loading...</div>
      <div class="user-id" id="sidebar-user-role">Student</div>
      <button id="logout-btn" class="btn btn-outline" style="margin-top: 10px; width: 100%; font-size: 0.8rem; padding: 7px;">Sign Out</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="app-main">
    <header class="main-header">
      <div>
        <h2>Search & Explore Listings</h2>
        <span style="font-size: 0.82rem; color: var(--im-text-dim);">Browse active internships and entry-level positions</span>
      </div>
      <span id="available-count-badge" style="font-family: var(--font-mono); font-size: 0.84rem; color: #a5b4fc; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); padding: 5px 14px; border-radius: var(--radius-full);">
        Loading listings…
      </span>
    </header>

    <div class="main-content" style="max-width: 1240px;">
      <div id="search-alert" class="alert-toast"></div>

      <div class="search-layout">
        <!-- Filters Sidebar (Figure 4.8) -->
        <aside class="filters-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--im-border);">
            <div style="font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--im-text-main);">Filters</div>
            <button id="reset-filters-btn" class="btn btn-outline" style="padding: 4px 10px; font-size: 0.78rem;">Reset</button>
          </div>

          <!-- Industry Filter -->
          <div class="filter-section">
            <div class="filter-title">Industry Sector</div>
            <select id="industry-filter" class="form-control">
              <option value="">All Industries</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Telecommunications">Telecommunications</option>
              <option value="Banking & Finance">Banking & Finance</option>
              <option value="Engineering & Energy">Engineering & Energy</option>
              <option value="Cybersecurity">Cybersecurity</option>
              <option value="E-Commerce & Tech">E-Commerce & Tech</option>
            </select>
          </div>

          <!-- Job Type Filter -->
          <div class="filter-section">
            <div class="filter-title">Placement Type</div>
            <div class="filter-checkbox-group">
              <label class="filter-checkbox-label">
                <input type="checkbox" name="jobType" value="Internship" checked /> Internship
              </label>
              <label class="filter-checkbox-label">
                <input type="checkbox" name="jobType" value="Full-Time" /> Full-Time (Fresh Grad)
              </label>
              <label class="filter-checkbox-label">
                <input type="checkbox" name="jobType" value="Part-Time" /> Part-Time
              </label>
            </div>
          </div>

          <!-- Location Filter -->
          <div class="filter-section">
            <div class="filter-title">Location / Mode</div>
            <select id="location-filter" class="form-control">
              <option value="">All Locations</option>
              <option value="Kuala Lumpur">Kuala Lumpur</option>
              <option value="Selangor">Selangor</option>
              <option value="Penang">Penang</option>
              <option value="Cyberjaya">Cyberjaya</option>
              <option value="Remote">Remote</option>
            </select>
          </div>

          <!-- Required Skills Filter -->
          <div class="filter-section">
            <div class="filter-title">Filter by Required Skills</div>
            <div class="filter-checkbox-group" id="skills-filter-group" style="max-height: 200px; overflow-y: auto; padding-right: 4px;">
              <!-- Populated dynamically with skill checkboxes -->
            </div>
          </div>

          <button id="apply-filters-btn" class="btn btn-primary" style="width: 100%; margin-top: 14px; padding: 11px;">Apply Active Filters</button>
        </aside>

        <!-- Search Input & Results Feed -->
        <div>
          <!-- Search Bar -->
          <div style="display: flex; gap: 12px; margin-bottom: 24px;">
            <input type="text" id="search-input" class="form-control" placeholder="Search by role title, hiring company, or keywords..." style="padding: 13px 18px; font-size: 0.95rem;" />
            <button id="search-btn" class="btn btn-primary" style="width: auto; padding: 13px 30px; font-size: 0.95rem;">Search</button>
          </div>

          <!-- Results Container -->
          <div id="search-results-container">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/search.js"></script>
</body>
</html>
