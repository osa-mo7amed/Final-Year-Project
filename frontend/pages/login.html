<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — InternMatch</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: radial-gradient(circle at top center, #1b283d 0%, #0d1117 75%);
    }
    .auth-card {
      background-color: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .auth-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand-badge">IM</div>
    <h2>Welcome back</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; margin-bottom: 24px;">
      Sign in to access your personalised dashboard
    </p>

    <div id="form-alert" class="alert-toast"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. osama@student.uniten.edu.my" required />
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-label" for="password">Password</label>
          <a href="#" style="font-size: 0.78rem; color: var(--text-dim);" onclick="alert('Password reset link will be sent to your email.');">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="margin-top: 10px;">Sign In →</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
      Don't have an account? <a href="register.html" style="font-weight: 600; color: #38bdf8;">Register Now</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', handleLogin);
</script>
</body>
</html>
